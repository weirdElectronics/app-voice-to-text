<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#000000">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Cuánto gastaste Laura?</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <!-- Imagen centrada -->
  <div>
    <img src="{{ url_for('static', filename='LAURA.jpg') }}" alt="Laura" class="logo">
  </div>

  <!-- Título -->
  <h1>¿Cuánto gastaste Laura?</h1>

  <!-- Selector de modo -->
  <label for="modo">Modo:</label>
  <select id="modo">
    <option value="texto" selected>Texto</option>
    <option value="suma">Suma (gastos)</option>
  </select>
  <br><br>

  <!-- Botones principales -->
  <button id="startBtn">Comenzar a Grabar</button>
  <button id="stopBtn" disabled>Detener y Enviar</button>
  <button id="resetBtn">Resetear documentos</button>

  <!-- Botones de documentos -->
  <h2>Documentos</h2>
  <button onclick="window.location.href='/ver_word'">Ver Word online</button>
  <button onclick="window.location.href='/descargar_doc'">Descargar Word</button>
  <button onclick="window.location.href='/ver_excel'">Ver Excel online</button>
  <button onclick="window.location.href='/descargar_excel'">Descargar Excel</button>

  <!-- Indicadores -->
  <p id="feedback"></p>
  <p id="status"></p>

  <!-- Script de grabación -->
  <script>
  let mediaRecorder;
  let audioChunks = [];

  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const status = document.getElementById('status');
  const resetBtn = document.getElementById('resetBtn');
  const feedback = document.getElementById('feedback');

  resetBtn.onclick = () => {
      fetch('/reset_documento', { method: 'POST' })
        .then(res => res.text())
        .then(data => {
            status.innerText = data;
            feedback.innerText = "📄 Documentos reiniciados";
        })
        .catch(err => {
            status.innerText = 'Error: ' + err;
            feedback.innerText = "⚠️ Error al resetear";
        });
  };

  startBtn.onclick = async () => {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              mediaRecorder = new MediaRecorder(stream);
              mediaRecorder.start();
              audioChunks = [];
              feedback.innerText = "🎙️ Grabación iniciada";

              mediaRecorder.ondataavailable = event => {
                  if (event.data.size > 0) audioChunks.push(event.data);
              };

              mediaRecorder.onstop = () => {
                  feedback.innerText = "⏹️ Procesando...";
                  const blob = new Blob(audioChunks, { type: 'audio/webm' });
                  const reader = new FileReader();

                  reader.onloadend = () => {
                      const base64data = reader.result;
                      const modo = document.getElementById('modo').value;

                      fetch('/guardar_audio', {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                          body: 'audio=' + encodeURIComponent(base64data) + '&modo=' + encodeURIComponent(modo)
                      })
                      .then(res => res.text())
                      .then(data => {
                          status.innerText = data;
                          feedback.innerText = "✅ Audio enviado y guardado";
                      })
                      .catch(err => {
                          status.innerText = 'Error: ' + err;
                          feedback.innerText = "⚠️ Error al enviar audio";
                      });
                  };
                  reader.readAsDataURL(blob);
              };

              status.innerText = "Grabando...";
              startBtn.disabled = true;
              stopBtn.disabled = false;
          } catch (err) {
              alert('Error al acceder al micrófono: ' + err);
              feedback.innerText = "⚠️ No se pudo acceder al micrófono";
          }
      } else {
          alert('El navegador no soporta grabación de audio.');
          feedback.innerText = "⚠️ Grabación no soportada";
      }
  };

  stopBtn.onclick = () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
          status.innerText = "Detenido, enviando...";
          feedback.innerText = "⏹️ Grabación detenida";
          startBtn.disabled = false;
          stopBtn.disabled = true;
      } else {
          alert('No hay grabación en curso.');
          feedback.innerText = "⚠️ No hay grabación activa";
      }
  };
  </script>
</body>
</html>
